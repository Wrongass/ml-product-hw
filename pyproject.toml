[project]
name = "ml-product-hw"
version = "0.1.0"
description = "Homework project"
readme = "README.md"
authors = [
    { name = "Kirill Morozov", email = "72659890+Wrongass@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.114",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
ml-product-hw = "ml_product_hw:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["B", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
files = ["src"]
exclude = ['\.venv/', '__pycache__/', 'build/', 'dist/']

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
